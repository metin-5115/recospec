<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Material UI-like Fixture</title>
  </head>
  <body>
    <form class="MuiFormControl-root css-1a2b3c" id="signup-form">
      <label for="mui-username" class="MuiInputLabel-root css-9d2f4e">Username</label>
      <input
        id="mui-username"
        type="text"
        name="username"
        class="MuiInputBase-input css-7f3q8r"
        aria-label="Username"
      />

      <label for="mui-email" class="MuiInputLabel-root css-9d2f4e">Email</label>
      <input
        id="mui-email"
        type="email"
        name="email"
        class="MuiInputBase-input css-7f3q8r"
        aria-label="Email address"
      />

      <button
        type="submit"
        class="MuiButton-root MuiButton-contained css-5x3q1a"
        aria-label="Create account"
      >
        Create account
      </button>
    </form>
  </body>
</html>
