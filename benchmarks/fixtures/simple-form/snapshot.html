<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Form Fixture</title>
  </head>
  <body>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" data-testid="login-email" placeholder="user@example.com" />

      <label for="password">Password</label>
      <input id="password" type="password" data-testid="login-password" placeholder="••••••••" />

      <button type="submit" data-testid="login-submit" aria-label="Sign In">Sign In</button>
    </form>
  </body>
</html>
