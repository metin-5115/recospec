name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:ci

      - name: Report coverage to PR
        uses: davelosert/vitest-coverage-report-action@v2
        if: always() && github.event_name == 'pull_request'

      - name: Mutation-survival benchmark
        run: pnpm bench

      - name: Build
        run: pnpm build

      # Order matters: `pnpm build` wipes dist/, and the VS Code build mirrors it.
      - name: Build VS Code extension
        run: pnpm build:vscode

      - name: Build CLI
        run: pnpm build:cli

      - name: Bundle size gate
        run: pnpm size
