<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Form — PlayForge E2E Fixture</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 400px;
        margin: 60px auto;
        padding: 0 20px;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-size: 14px;
        color: #374151;
      }
      input,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 12px;
        margin-bottom: 16px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 14px;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover {
        background: #1d4ed8;
      }
      #success {
        display: none;
        color: #16a34a;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1 style="font-size: 20px; margin-bottom: 24px">Contact Form</h1>
    <form id="contact-form">
      <label for="name">Name</label>
      <input
        id="name"
        data-testid="name-input"
        type="text"
        placeholder="Your name"
        autocomplete="off"
      />

      <label for="email">Email</label>
      <input
        id="email"
        data-testid="email-input"
        type="email"
        placeholder="you@example.com"
        autocomplete="off"
      />

      <button data-testid="submit-btn" type="submit">Send</button>
    </form>
    <p id="success">Form submitted!</p>

    <script>
      document.getElementById('contact-form').addEventListener('submit', function (e) {
        e.preventDefault()
        document.getElementById('success').style.display = 'block'
      })
    </script>
  </body>
</html>
